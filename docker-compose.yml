services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      - backend
      - redis
      - mongo
    volumes:
      - ./storage:/app/storage

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: python -m app.scheduler.cron
    depends_on:
      - worker
      - redis
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage:/var/www/storage:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mongo_data:
  redis_data:
